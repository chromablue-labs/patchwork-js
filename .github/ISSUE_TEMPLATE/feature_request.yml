name: Feature request
description: Something a package should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The integration problem, not the proposed API.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      render: typescript
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Optional.
      render: typescript
